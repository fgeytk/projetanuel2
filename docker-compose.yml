services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      QUIZ_DB_PATH: /data/quiz.db
      QUIZ_SQL_FILE: /app/quiz (5).sql
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - ./quiz (5).sql:/app/quiz (5).sql:ro
      - quiz-data:/data

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      - backend

volumes:
  quiz-data:
  frontend-node-modules:
